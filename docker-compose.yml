services:
  postgres:
    image: postgres:16-alpine
    container_name: devlens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devlens

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devlens-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: devlens-backend
    restart: unless-stopped

    env_file:
      - ./server/.env.docker

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./server:/app
      - /app/node_modules

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: devlens-worker
    restart: unless-stopped

    env_file:
      - ./server/.env.docker

    command: npm run worker

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: devlens-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      backend:
        condition: service_started

    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres-data:
  redis-data: