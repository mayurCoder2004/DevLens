services:
  postgres:
    image: postgres:16-alpine
    container_name: devlens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devlens

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devlens-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: devlens-backend
    restart: unless-stopped

    env_file:
      - ./server/.env.docker

    ports:
      - "5000:5000"

    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: devlens-worker
    restart: unless-stopped

    env_file:
      - ./server/.env.docker

    command: npm run worker

    depends_on:
      - postgres
      - redis

volumes:
  postgres-data:
  redis-data: